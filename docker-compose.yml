services:
    postgres:
        image: postgres:16
        restart: unless-stopped
        ports:
            - "5433:5432"
        environment:
            POSTGRES_USER: vvs
            POSTGRES_PASSWORD: vvs_dev_password
            POSTGRES_DB: vvs_dev
        volumes:
            - pgdata:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data

volumes:
    pgdata:
    redisdata:
